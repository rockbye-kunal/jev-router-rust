[package]
name = "jev-router"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Self-hosted, OpenRouter-compatible router that picks the model and reasoning effort for each request using Jev"
repository = "https://github.com/rockbye-kunal/jev-router-rust"
readme = "README.md"
keywords = ["openrouter", "llm", "router", "ai-gateway", "jev"]
categories = ["web-programming::http-server", "command-line-utilities"]

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"
thiserror = "2"
globset = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
fs2 = "0.4"
url = "2"
zeroize = "1"
tower-http = { version = "0.6", features = ["cors"] }
regex = "1"
httpdate = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
